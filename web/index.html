<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17212b" />
    <title>Vesperloop</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="view active" data-view="threads">
        <header class="topbar">
          <div>
            <h1>Vesperloop</h1>
            <p>Claude Code</p>
          </div>
          <span id="auth-chip" class="chip success">Подключён</span>
        </header>

        <section class="usage-card card">
          <div class="section-heading">
            <h2>Лимиты</h2>
            <button class="text-button" data-nav="settings">Подробнее</button>
          </div>
          <div id="limits" class="limits"></div>
        </section>

        <div class="section-heading list-heading">
          <h2>Треды</h2>
          <span id="thread-count" class="muted"></span>
        </div>
        <section id="threads-list" class="list-card card"></section>
      </section>

      <section class="view" data-view="detail">
        <header class="detail-topbar">
          <button class="icon-button" data-nav="threads" aria-label="Назад">‹</button>
          <h1 id="detail-title">Тред</h1>
          <span></span>
        </header>
        <section id="run-card" class="run-card card hidden"></section>
        <section class="settings-card card">
          <button class="setting-row" id="model-row">
            <span class="setting-icon">◉</span>
            <span>Модель</span>
            <strong id="detail-model"></strong>
            <span class="chevron">›</span>
          </button>
          <div class="setting-row" id="cwd-row">
            <span class="setting-icon">⌁</span>
            <span>Директория</span>
            <strong id="detail-cwd" class="mono"></strong>
          </div>
          <label class="setting-row">
            <span class="setting-icon">⌁</span>
            <span>Ход выполнения</span>
            <input id="verbose-toggle" type="checkbox" role="switch" />
          </label>
        </section>
        <div class="section-heading list-heading"><h2>Сессии</h2></div>
        <section id="sessions-list" class="list-card card"></section>
        <button id="new-session" class="primary-button">Новая сессия</button>
      </section>

      <section class="view" data-view="files">
        <header class="topbar compact"><h1>Workspace</h1></header>
        <div class="segmented">
          <button class="active" data-section="files">Файлы</button>
          <button data-section="auth">Авторизация</button>
        </div>
        <section id="files-section">
          <div id="workspace-path" class="path-card card mono">—</div>
          <section id="files-list" class="list-card card files-list"></section>
        </section>
        <section id="auth-section" class="hidden">
          <div class="auth-card card">
            <div class="auth-icon">C</div>
            <div><h2>Claude</h2><p id="auth-state">Проверяем авторизацию…</p></div>
          </div>
          <button id="refresh-auth" class="primary-button">Обновить статус</button>
        </section>
      </section>

      <section class="view" data-view="settings">
        <header class="topbar compact"><h1>Настройки</h1></header>
        <section class="settings-card card">
          <button class="setting-row" data-section-link="auth">
            <span class="setting-icon">◇</span><span>Авторизация Claude</span><span class="chevron">›</span>
          </button>
          <button class="setting-row" id="refresh-all">
            <span class="setting-icon">↻</span><span>Обновить данные</span><span class="chevron">›</span>
          </button>
        </section>
      </section>
    </main>

    <dialog id="model-dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="section-heading"><h2>Выбери модель</h2><button id="close-model" class="text-button">Закрыть</button></div>
      <div id="model-options" class="model-options"></div>
    </dialog>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="active" data-nav="threads"><span>◯</span>Треды</button>
      <button data-nav="files"><span>▱</span>Файлы</button>
      <button data-nav="settings"><span>⚙</span>Настройки</button>
    </nav>
    <div id="toast" class="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
